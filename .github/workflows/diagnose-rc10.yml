name: Diagnose rc10 Quarkus test routing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-rc10.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Verify original HTTP assertions against packaged application
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.4.0-rc.10
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            quarkus/pom.xml
      - name: Run the existing HTTP contract as a packaged integration test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('quarkus/src/test/java/io/github/p4535992/ooxmlcompatnormalize/quarkus/NormalizeResourceTest.java')
          s = p.read_text().replace('QuarkusTest', 'QuarkusIntegrationTest').replace('class NormalizeResourceTest', 'class NormalizeResourceIT')
          p.with_name('NormalizeResourceIT.java').write_text(s)
          p.unlink()
          pom = Path('quarkus/pom.xml')
          plugin = '''      <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-failsafe-plugin</artifactId>
                  <version>${surefire-plugin.version}</version>
                  <executions><execution><goals><goal>integration-test</goal><goal>verify</goal></goals></execution></executions>
                  <configuration>
                    <systemPropertyVariables>
                      <java.util.logging.manager>org.jboss.logmanager.LogManager</java.util.logging.manager>
                      <maven.home>${maven.home}</maven.home>
                    </systemPropertyVariables>
                  </configuration>
                </plugin>
          '''
          pom.write_text(pom.read_text().replace('    </plugins>', plugin + '    </plugins>'))
          PY
      - name: Build and verify without skipping tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f java/pom.xml clean install
          mvn -B -ntp -f quarkus/pom.xml clean verify
