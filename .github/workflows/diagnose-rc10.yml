name: Diagnose rc10 Quarkus test routing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-rc10.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Test resource registration - ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [module-directory, absolute-path, explicit-scope, flat-classpath]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.4.0-rc.10
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            quarkus/pom.xml
      - name: Isolate test bootstrap settings without changing assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          variant = os.environ['VARIANT']
          p = Path('quarkus/src/main/java/io/github/p4535992/ooxmlcompatnormalize/quarkus/NormalizeResource.java')
          s = p.read_text()
          if variant == 'absolute-path':
              s = s.replace('@Path("api")', '@Path("/api")').replace('@Path("info")', '@Path("/info")').replace('@Path("audit")', '@Path("/audit")').replace('@Path("normalize")', '@Path("/normalize")')
          elif variant == 'explicit-scope':
              s = s.replace('@Path("api")', '@jakarta.enterprise.context.ApplicationScoped\n@Path("api")')
          elif variant == 'flat-classpath':
              config = Path('quarkus/src/main/resources/application.properties')
              config.write_text(config.read_text() + '\nquarkus.test.flat-class-path=true\n')
          p.write_text(s)
          PY
      - name: Build core and run all original Quarkus assertions
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f java/pom.xml clean install
          if [ "$VARIANT" = module-directory ]; then
            (cd quarkus && mvn -B -ntp clean test)
          else
            mvn -B -ntp -f quarkus/pom.xml clean test
          fi
