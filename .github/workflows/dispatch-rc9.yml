name: Dispatch v0.4.0-rc.9

on:
  push:
    paths:
      - '.github/workflows/dispatch-rc9.yml'

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: "${{ github.event.head_commit.message == 'release: dispatch v0.4.0-rc.9' }}"
    runs-on: ubuntu-24.04
    env:
      TAG: v0.4.0-rc.9
      BUNDLE_DIR: docker-release-bundles
      JAVA_BUNDLE: OOXML-Compat-Normalize-java-docker-compose
      PYTHON_BUNDLE: OOXML-Compat-Normalize-python-docker-compose

    steps:
      - name: Checkout final rc9 source
        uses: actions/checkout@v5

      - name: Create self-contained Docker Compose bundles
        shell: bash
        run: |
          set -euo pipefail
          bash docker/package-release-bundles.sh "$BUNDLE_DIR"
          unzip -l "$BUNDLE_DIR/$JAVA_BUNDLE.zip" | head -n 30
          unzip -l "$BUNDLE_DIR/$PYTHON_BUNDLE.zip" | head -n 30

      - name: Verify Docker bundles build from their own directories
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$BUNDLE_DIR/$JAVA_BUNDLE"
            docker compose config >/dev/null
            docker compose build
          )
          (
            cd "$BUNDLE_DIR/$PYTHON_BUNDLE"
            docker compose config >/dev/null
            docker compose build
          )

      - name: Dispatch full portable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run portable-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$TAG" \
            -f prerelease=true

      - name: Wait for the release and attach Docker bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          found=false
          for i in $(seq 1 180); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 5
          done
          if [[ "$found" != true ]]; then
            echo "Release $TAG was not created by the portable release workflow" >&2
            exit 1
          fi

          gh release upload "$TAG" \
            "$BUNDLE_DIR/$JAVA_BUNDLE.zip" \
            "$BUNDLE_DIR/$PYTHON_BUNDLE.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          rm -rf checksum-update
          mkdir -p checksum-update
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir checksum-update

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          root = Path(os.environ['BUNDLE_DIR'])
          checksum = Path('checksum-update/SHA256SUMS.txt')
          lines = []
          if checksum.exists():
              for line in checksum.read_text(encoding='utf-8').splitlines():
                  if 'docker-compose.zip' not in line:
                      lines.append(line)
          for name in (os.environ['JAVA_BUNDLE'], os.environ['PYTHON_BUNDLE']):
              path = root / f'{name}.zip'
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}')
          checksum.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          gh release upload "$TAG" checksum-update/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify final release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets"
          grep -Fxq "$JAVA_BUNDLE.zip" <<<"$assets"
          grep -Fxq "$PYTHON_BUNDLE.zip" <<<"$assets"
          grep -Fxq 'OOXML-Compat-Normalize-java-core.jar' <<<"$assets"
          grep -Fxq 'OOXML-Compat-Normalize-java-quarkus.jar' <<<"$assets"
          grep -Fxq 'OOXML-Compat-Normalize-java-portable-win-x64.zip' <<<"$assets"
          grep -Fxq 'OOXML-Compat-Normalize-python-portable-win-x64.zip' <<<"$assets"
          grep -Fxq 'SHA256SUMS.txt' <<<"$assets"
