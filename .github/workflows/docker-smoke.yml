name: Docker Compose smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Dockerfile.python'
      - 'Dockerfile.combined'
      - 'docker-compose.yml'
      - 'docker-compose.java.yml'
      - 'docker-compose.python.yml'
      - 'docker-compose.combined.yml'
      - '.dockerignore'
      - 'docker/**'
      - 'java/**'
      - 'quarkus/**'
      - 'src/**'
      - 'dotnet/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_LICENSES.md'
      - '.github/workflows/docker-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Docker ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: java
            compose: docker-compose.java.yml
            service: normalizer-java
            log_file: /data/logs/ooxml-compat-normalize-quarkus.log
            log_marker: OOXML Compat Normalize Quarkus local service started
          - engine: python
            compose: docker-compose.python.yml
            service: normalizer-python
            log_file: /data/logs/ooxml-compat-normalize-python.log
            log_marker: OOXML Compat Normalize Python web service started

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and start ${{ matrix.engine }} container
        shell: bash
        env:
          COMPOSE_FILE: ${{ matrix.compose }}
        run: |
          set -euo pipefail
          export OOXML_PORT=18083
          export OOXML_CONTEXT_PATH=/ooxml-compat-normalize
          docker compose -f "$COMPOSE_FILE" up --build -d

      - name: Verify context-prefixed UI, REST API, normalization, logs and non-root runtime
        shell: bash
        env:
          COMPOSE_FILE: ${{ matrix.compose }}
          SERVICE: ${{ matrix.service }}
          ENGINE: ${{ matrix.engine }}
          LOG_FILE: ${{ matrix.log_file }}
          LOG_MARKER: ${{ matrix.log_marker }}
        run: |
          set -euo pipefail
          export OOXML_PORT=18083
          export OOXML_CONTEXT_PATH=/ooxml-compat-normalize
          BASE_URL="http://127.0.0.1:${OOXML_PORT}${OOXML_CONTEXT_PATH}"

          compose() {
            docker compose -f "$COMPOSE_FILE" "$@"
          }
          cleanup() {
            compose logs "$SERVICE" || true
            compose down -v || true
          }
          trap cleanup EXIT

          started=false
          for i in $(seq 1 90); do
            if curl -fsS "$BASE_URL/api/info" > /tmp/ooxml-docker-info.json; then
              started=true
              break
            fi
            sleep 1
          done
          if [[ "$started" != true ]]; then
            echo "Dockerized $ENGINE service did not become ready" >&2
            exit 1
          fi

          curl -fsS "$BASE_URL/" > /tmp/ooxml-docker-home.html
          grep -q 'OOXML Compat Normalize' /tmp/ooxml-docker-home.html
          grep -q 'Normalizza e scarica' /tmp/ooxml-docker-home.html
          grep -q '"contextPath"[[:space:]]*:[[:space:]]*"/ooxml-compat-normalize"' /tmp/ooxml-docker-info.json
          cat /tmp/ooxml-docker-info.json

          if curl -fsS "http://127.0.0.1:${OOXML_PORT}/api/info" >/dev/null 2>&1; then
            echo "Unexpected root-level /api/info route for $ENGINE" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          target = Path('/tmp/ooxml-rest-smoke.docx')
          content_types = b'''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
            <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
            <Default Extension="xml" ContentType="application/xml"/>
            <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
          </Types>'''
          root_rels = b'''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
            <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
          </Relationships>'''
          document = b'''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
            <w:body><w:p><w:r><w:t>OOXML Docker REST smoke test</w:t></w:r></w:p><w:sectPr/></w:body>
          </w:document>'''
          with ZipFile(target, 'w', ZIP_DEFLATED) as zf:
              zf.writestr('[Content_Types].xml', content_types)
              zf.writestr('_rels/.rels', root_rels)
              zf.writestr('word/document.xml', document)
          PY

          curl -fsS \
            -X POST \
            -H 'Content-Type: application/octet-stream' \
            -H 'X-Filename: ooxml-rest-smoke.docx' \
            --data-binary @/tmp/ooxml-rest-smoke.docx \
            "$BASE_URL/api/audit" \
            > /tmp/ooxml-docker-audit.json
          grep -qi 'docx' /tmp/ooxml-docker-audit.json
          cat /tmp/ooxml-docker-audit.json

          curl -fsS \
            -X POST \
            -H 'Content-Type: application/octet-stream' \
            -H 'X-Filename: ooxml-rest-smoke.docx' \
            --data-binary @/tmp/ooxml-rest-smoke.docx \
            "$BASE_URL/api/normalize?profile=preserve-v1" \
            -o /tmp/ooxml-rest-normalized.docx

          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('/tmp/ooxml-rest-normalized.docx') as zf:
              assert '[Content_Types].xml' in zf.namelist()
              assert 'word/document.xml' in zf.namelist()
              assert zf.testzip() is None
          PY

          compose exec -T "$SERVICE" sh -c 'test -w /data/logs'
          for i in $(seq 1 20); do
            if compose exec -T "$SERVICE" sh -c "test -s '$LOG_FILE'"; then
              break
            fi
            sleep 0.25
          done
          compose exec -T "$SERVICE" sh -c "test -s '$LOG_FILE'"
          compose exec -T "$SERVICE" grep -q "$LOG_MARKER" "$LOG_FILE"

          uid="$(compose exec -T "$SERVICE" id -u)"
          test "$uid" != '0'
          compose exec -T "$SERVICE" test -r /app/licenses/LICENSE
          compose exec -T "$SERVICE" test -r /app/licenses/THIRD_PARTY_NOTICES.md
          compose exec -T "$SERVICE" test -r /app/licenses/THIRD_PARTY_LICENSES.md

          if [[ "$ENGINE" == java ]]; then
            compose exec -T "$SERVICE" sh -c 'test -d "$JAVA_HOME/legal"'
          else
            compose exec -T "$SERVICE" test -x /app/validator/OpenXmlSdkValidator
            compose exec -T "$SERVICE" test -r /app/licenses/dotnet/LICENSE.txt
            compose exec -T "$SERVICE" test -r /app/licenses/dotnet/ThirdPartyNotices.txt
          fi

          compose restart "$SERVICE"
          restarted=false
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL/api/info" >/dev/null; then
              restarted=true
              break
            fi
            sleep 1
          done
          test "$restarted" = true
          compose exec -T "$SERVICE" sh -c "test -s '$LOG_FILE'"
          test "$(compose exec -T "$SERVICE" id -u)" != '0'

          trap - EXIT
          cleanup

  smoke_combined:
    name: Docker combined Java + Python
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and start combined container
        shell: bash
        run: |
          set -euo pipefail
          export OOXML_PORT=18084
          export OOXML_CONTEXT_PATH=/ooxml-compat-normalize
          export OOXML_DEFAULT_ENGINE=python
          docker compose -f docker-compose.combined.yml up --build -d

      - name: Verify selectable Java and Python engines in one container
        shell: bash
        run: |
          set -euo pipefail
          export OOXML_PORT=18084
          export OOXML_CONTEXT_PATH=/ooxml-compat-normalize
          export OOXML_DEFAULT_ENGINE=python
          BASE_URL="http://127.0.0.1:${OOXML_PORT}${OOXML_CONTEXT_PATH}"

          compose() {
            docker compose -f docker-compose.combined.yml "$@"
          }
          cleanup() {
            compose logs normalizer-combined || true
            compose down -v || true
          }
          trap cleanup EXIT

          started=false
          for i in $(seq 1 120); do
            if curl -fsS "$BASE_URL/api/info" > /tmp/ooxml-combined-info.json; then
              started=true
              break
            fi
            sleep 1
          done
          if [[ "$started" != true ]]; then
            echo 'Combined Docker service did not become ready' >&2
            exit 1
          fi

          grep -q '"engine"[[:space:]]*:[[:space:]]*"combined"' /tmp/ooxml-combined-info.json
          grep -q '"defaultEngine"[[:space:]]*:[[:space:]]*"python"' /tmp/ooxml-combined-info.json
          grep -q '"contextPath"[[:space:]]*:[[:space:]]*"/ooxml-compat-normalize"' /tmp/ooxml-combined-info.json
          grep -q '"java"' /tmp/ooxml-combined-info.json
          grep -q '"python"' /tmp/ooxml-combined-info.json

          curl -fsS "$BASE_URL/" > /tmp/ooxml-combined-home.html
          grep -q 'OOXML Compat Normalize' /tmp/ooxml-combined-home.html
          grep -q 'id="mode"' /tmp/ooxml-combined-home.html
          grep -q 'value="both"' /tmp/ooxml-combined-home.html
          grep -q 'Solo Python' /tmp/ooxml-combined-home.html
          grep -q 'Solo Java / Quarkus' /tmp/ooxml-combined-home.html
          grep -q 'id="engine"' /tmp/ooxml-combined-home.html
          grep -q 'Normalizza e scarica' /tmp/ooxml-combined-home.html

          if curl -fsS "http://127.0.0.1:${OOXML_PORT}/api/info" >/dev/null 2>&1; then
            echo 'Unexpected root-level /api/info route for combined stack' >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          target = Path('/tmp/ooxml-combined-smoke.docx')
          content_types = b'''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
            <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
            <Default Extension="xml" ContentType="application/xml"/>
            <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
          </Types>'''
          root_rels = b'''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
            <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
          </Relationships>'''
          document = b'''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
            <w:body><w:p><w:r><w:t>OOXML combined engine smoke test</w:t></w:r></w:p><w:sectPr/></w:body>
          </w:document>'''
          with ZipFile(target, 'w', ZIP_DEFLATED) as zf:
              zf.writestr('[Content_Types].xml', content_types)
              zf.writestr('_rels/.rels', root_rels)
              zf.writestr('word/document.xml', document)
          PY

          for engine in python java; do
            curl -fsS "$BASE_URL/api/info?engine=$engine" > "/tmp/ooxml-$engine-info.json"
            grep -q "\"engine\"[[:space:]]*:[[:space:]]*\"$engine\"" "/tmp/ooxml-$engine-info.json"

            curl -fsS \
              -X POST \
              -H 'Content-Type: application/octet-stream' \
              -H 'X-Filename: ooxml-combined-smoke.docx' \
              -H "X-OOXML-Engine: $engine" \
              --data-binary @/tmp/ooxml-combined-smoke.docx \
              "$BASE_URL/api/audit?engine=$engine" \
              > "/tmp/ooxml-$engine-audit.json"
            grep -qi 'docx' "/tmp/ooxml-$engine-audit.json"

            curl -fsS \
              -D "/tmp/ooxml-$engine-headers.txt" \
              -X POST \
              -H 'Content-Type: application/octet-stream' \
              -H 'X-Filename: ooxml-combined-smoke.docx' \
              -H "X-OOXML-Engine: $engine" \
              --data-binary @/tmp/ooxml-combined-smoke.docx \
              "$BASE_URL/api/normalize?engine=$engine&profile=preserve-v1" \
              -o "/tmp/ooxml-$engine-normalized.docx"
            grep -qi "^X-OOXML-Selected-Engine: $engine" "/tmp/ooxml-$engine-headers.txt"
            grep -qi "^X-OOXML-Engine: $engine" "/tmp/ooxml-$engine-headers.txt"

            ENGINE="$engine" python - <<'PY'
          import os
          from zipfile import ZipFile
          engine = os.environ['ENGINE']
          with ZipFile(f'/tmp/ooxml-{engine}-normalized.docx') as zf:
              assert '[Content_Types].xml' in zf.namelist()
              assert 'word/document.xml' in zf.namelist()
              assert zf.testzip() is None
          PY
          done

          compose exec -T normalizer-combined sh -c 'test -w /data/logs'
          compose exec -T normalizer-combined test -s /data/logs/ooxml-compat-normalize-gateway.log
          compose exec -T normalizer-combined test -s /data/logs/ooxml-compat-normalize-python.log
          compose exec -T normalizer-combined test -s /data/logs/ooxml-compat-normalize-quarkus.log
          compose exec -T normalizer-combined grep -q 'combined gateway started' /data/logs/ooxml-compat-normalize-gateway.log
          compose exec -T normalizer-combined grep -q 'Python web service started' /data/logs/ooxml-compat-normalize-python.log
          compose exec -T normalizer-combined grep -q 'Quarkus local service started' /data/logs/ooxml-compat-normalize-quarkus.log

          test "$(compose exec -T normalizer-combined id -u)" != '0'
          compose exec -T normalizer-combined test -r /app/licenses/LICENSE
          compose exec -T normalizer-combined test -r /app/licenses/THIRD_PARTY_NOTICES.md
          compose exec -T normalizer-combined test -r /app/licenses/THIRD_PARTY_LICENSES.md
          compose exec -T normalizer-combined test -x /app/validator/OpenXmlSdkValidator
          compose exec -T normalizer-combined test -r /app/licenses/dotnet/LICENSE.txt
          compose exec -T normalizer-combined test -r /app/licenses/dotnet/ThirdPartyNotices.txt
          compose exec -T normalizer-combined java -version
          compose exec -T normalizer-combined test -r /usr/share/doc/openjdk-17-jre-headless/copyright

          compose restart normalizer-combined
          restarted=false
          for i in $(seq 1 90); do
            if curl -fsS "$BASE_URL/api/info?engine=python" >/dev/null \
              && curl -fsS "$BASE_URL/api/info?engine=java" >/dev/null; then
              restarted=true
              break
            fi
            sleep 1
          done
          test "$restarted" = true

          trap - EXIT
          cleanup
