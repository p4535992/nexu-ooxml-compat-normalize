name: Full history secret audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-history-secret-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan all historical paths and unique blobs
        shell: bash
        run: |
          set -euo pipefail

          git log --all --name-only --pretty=format: | sed '/^$/d' | sort -u > /tmp/all-paths.txt
          if grep -E -i '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.(pem|p12|pfx|jks|keystore)$|.*(secret|credential|password).*)' /tmp/all-paths.txt; then
            echo '::error::Potentially sensitive historical path detected.'
            exit 1
          fi

          git rev-list --objects --all | awk '{print $1}' | sort -u > /tmp/all-objects.txt
          git cat-file --batch-check='%(objectname) %(objecttype) %(objectsize)' < /tmp/all-objects.txt \
            | awk '$2 == "blob" && $3 <= 5242880 {print $1}' > /tmp/blobs.txt

          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          patterns = {
              'private_key': re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'github_pat': re.compile(rb'\b(?:ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b'),
              'openai_key': re.compile(rb'\bsk-[A-Za-z0-9_-]{20,}\b'),
              'aws_access_key': re.compile(rb'\bAKIA[0-9A-Z]{16}\b'),
              'slack_token': re.compile(rb'\bxox[baprs]-[A-Za-z0-9-]{10,}\b'),
              'bearer_token': re.compile(rb'(?i)authorization\s*:\s*bearer\s+[A-Za-z0-9._~+/-]{16,}'),
              'credential_url': re.compile(rb'https?://[^\s/:@]+:[^\s/@]{6,}@'),
              'secret_assignment': re.compile(
                  rb'(?i)(?:password|passwd|client_secret|api[_-]?key|access[_-]?token)\s*[:=]\s*["\']?[^$<{\s"\']{8,}'
              ),
          }

          hits = []
          blobs = Path('/tmp/blobs.txt').read_text().splitlines()
          for index, sha in enumerate(blobs, 1):
              proc = subprocess.run(
                  ['git', 'cat-file', 'blob', sha],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if proc.returncode:
                  continue
              data = proc.stdout
              for name, pattern in patterns.items():
                  match = pattern.search(data)
                  if match:
                      # Never print the matched secret value.
                      hits.append((sha, name))
              if index % 500 == 0:
                  print(f'Scanned {index}/{len(blobs)} historical blobs')

          if hits:
              for sha, name in hits:
                  print(f'::error::Potential {name} in historical blob {sha}')
              raise SystemExit(f'Found {len(hits)} potential secret occurrence(s)')

          print(f'Full-history scan passed: {len(blobs)} unique blobs <= 5 MiB checked.')
          PY
