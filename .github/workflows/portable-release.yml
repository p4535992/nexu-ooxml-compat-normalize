name: Portable builds and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. v0.4.0. Leave empty for build-only.'
        required: false
        type: string
      prerelease:
        description: 'Publish as GitHub pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release_config:
    name: Resolve release configuration
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.config.outputs.tag }}
      prerelease: ${{ steps.config.outputs.prerelease }}
      publish: ${{ steps.config.outputs.publish }}

    steps:
      - id: config
        name: Resolve tag and release mode
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG=""
          PRERELEASE="false"
          PUBLISH="false"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PUBLISH="true"
            [[ "$TAG" == *-* ]] && PRERELEASE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${MANUAL_TAG:-}" ]]; then
            TAG="$MANUAL_TAG"
            PRERELEASE="${MANUAL_PRERELEASE:-false}"
            PUBLISH="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: release_config
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: OOXML-Compat-Normalize-win-x64
            validator: dotnet/OpenXmlSdkValidator/bin/Release/net8.0/win-x64/publish/OpenXmlSdkValidator.exe
          - os: ubuntu-22.04
            rid: linux-x64
            artifact: OOXML-Compat-Normalize-linux-x64
            validator: dotnet/OpenXmlSdkValidator/bin/Release/net8.0/linux-x64/publish/OpenXmlSdkValidator
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Linux GUI prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tk-dev tcl-dev

      - name: Run Python tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Verify Tkinter
        shell: bash
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Publish self-contained Open XML SDK validator
        shell: bash
        run: >-
          dotnet publish dotnet/OpenXmlSdkValidator/OpenXmlSdkValidator.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Install PyInstaller
        shell: bash
        run: python -m pip install --upgrade pip "pyinstaller>=6.10"

      - name: Build one-file GUI executable
        shell: bash
        env:
          OPENXML_VALIDATOR_BIN: ${{ matrix.validator }}
        run: pyinstaller --clean --noconfirm portable/OOXMLCompatNormalize.spec

      - name: Smoke-test executable presence
        shell: bash
        run: |
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -type f -name 'OOXML-Compat-Normalize*' -print -quit)"

      - name: Prepare portable payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          cp dist/OOXML-Compat-Normalize* payload/
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md payload/
          python - <<'PY'
          from pathlib import Path
          import hashlib
          base = Path('payload')
          lines = []
          for p in sorted(base.glob('OOXML-Compat-Normalize*')):
              if p.is_file():
                  lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (base / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: payload/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: needs.release_config.outputs.publish == 'true'
    needs: [release_config, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all portable artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for dir in OOXML-Compat-Normalize-*; do
            [ -d "$dir" ] || continue
            if [[ "$dir" == *win-* ]]; then
              (cd "$dir" && zip -9 -r "../${dir}.zip" .)
            else
              chmod +x "$dir"/OOXML-Compat-Normalize || true
              (cd "$dir" && tar -czf "../${dir}.tar.gz" .)
            fi
          done
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_config.outputs.tag }}
          PRERELEASE: ${{ needs.release_config.outputs.prerelease }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$PRERELEASE" == "true" ]]; then
            EXTRA+=(--prerelease)
          fi
          gh release create "$TAG" \
            release/*.zip \
            release/*.tar.gz \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${EXTRA[@]}"
