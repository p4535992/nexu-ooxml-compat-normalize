name: Portable builds and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. v0.4.0. Leave empty for build-only.'
        required: false
        type: string
      prerelease:
        description: 'Publish as GitHub pre-release'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'java/**'
      - 'quarkus/**'
      - 'portable/**'
      - 'dotnet/**'
      - 'pyproject.toml'
      - '.github/workflows/portable-release.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release_config:
    name: Resolve release configuration
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.config.outputs.tag }}
      prerelease: ${{ steps.config.outputs.prerelease }}
      publish: ${{ steps.config.outputs.publish }}

    steps:
      - id: config
        name: Resolve tag and release mode
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG=""
          PRERELEASE="false"
          PUBLISH="false"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PUBLISH="true"
            [[ "$TAG" == *-* ]] && PRERELEASE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${MANUAL_TAG:-}" ]]; then
            TAG="$MANUAL_TAG"
            PRERELEASE="${MANUAL_PRERELEASE:-false}"
            PUBLISH="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build_python:
    name: Build Python desktop ${{ matrix.rid }}
    needs: release_config
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: OOXML-Compat-Normalize-python-portable-win-x64
            validator: dotnet/OpenXmlSdkValidator/bin/Release/net8.0/win-x64/publish/OpenXmlSdkValidator.exe
          - os: ubuntu-22.04
            rid: linux-x64
            artifact: OOXML-Compat-Normalize-python-portable-linux-x64
            validator: dotnet/OpenXmlSdkValidator/bin/Release/net8.0/linux-x64/publish/OpenXmlSdkValidator
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Linux GUI prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tk-dev tcl-dev

      - name: Run Python tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Verify Tkinter
        shell: bash
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Publish self-contained Open XML SDK validator
        shell: bash
        run: >-
          dotnet publish dotnet/OpenXmlSdkValidator/OpenXmlSdkValidator.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Install PyInstaller
        shell: bash
        run: python -m pip install --upgrade pip "pyinstaller>=6.10"

      - name: Build one-file GUI executable
        shell: bash
        env:
          OPENXML_VALIDATOR_BIN: ${{ matrix.validator }}
        run: pyinstaller --clean --noconfirm portable/OOXMLCompatNormalize.spec

      - name: Smoke-test executable presence
        shell: bash
        run: |
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -type f -name 'OOXML-Compat-Normalize*' -print -quit)"

      - name: Prepare Python portable payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          cp dist/OOXML-Compat-Normalize* payload/
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md payload/
          python - <<'PY'
          from pathlib import Path
          import hashlib
          base = Path('payload')
          lines = []
          for p in sorted(base.glob('OOXML-Compat-Normalize*')):
              if p.is_file():
                  lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (base / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload Python portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: payload/
          if-no-files-found: error

  java:
    name: Build Java core and Quarkus JARs
    needs: release_config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            quarkus/pom.xml

      - name: Build, test and install Java core
        shell: bash
        run: mvn -B -ntp -f java/pom.xml clean install

      - name: Smoke-test standalone core JAR
        shell: bash
        run: |
          set -euo pipefail
          CORE_JAR="$(find java/target -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          test -n "$CORE_JAR"
          java -jar "$CORE_JAR" --help

      - name: Build and test Quarkus local service
        shell: bash
        run: mvn -B -ntp -f quarkus/pom.xml clean verify package

      - name: Smoke-test Quarkus uber-JAR, home page and diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          QUARKUS_JAR="$(find quarkus/target -maxdepth 1 -type f -name '*-runner.jar' -print -quit)"
          test -n "$QUARKUS_JAR"
          LOG_FILE="$RUNNER_TEMP/ooxml-quarkus-smoke.log"
          HOME_FILE="$RUNNER_TEMP/ooxml-quarkus-home.html"
          rm -f "$LOG_FILE" "$HOME_FILE"
          OOXML_LOG_FILE="$LOG_FILE" QUARKUS_HTTP_PORT=18080 \
            java -jar "$QUARKUS_JAR" >"$RUNNER_TEMP/ooxml-quarkus-console.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          started=false
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/api/info >"$RUNNER_TEMP/ooxml-info.json"; then
              started=true
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$started" != true ]]; then
            cat "$RUNNER_TEMP/ooxml-quarkus-console.log"
            [[ -f "$LOG_FILE" ]] && cat "$LOG_FILE"
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/ > "$HOME_FILE"
          grep -q 'OOXML Compat Normalize' "$HOME_FILE"
          grep -q 'Normalizza e scarica' "$HOME_FILE"
          cat "$RUNNER_TEMP/ooxml-info.json"
          for i in $(seq 1 20); do
            [[ -s "$LOG_FILE" ]] && break
            sleep 0.25
          done
          test -s "$LOG_FILE"
          grep -q 'OOXML Compat Normalize Quarkus local service started' "$LOG_FILE"
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT

      - name: Prepare Java JAR payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p java-jars
          CORE_JAR="$(find java/target -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          QUARKUS_JAR="$(find quarkus/target -maxdepth 1 -type f -name '*-runner.jar' -print -quit)"
          cp "$CORE_JAR" java-jars/OOXML-Compat-Normalize-java-core.jar
          cp "$QUARKUS_JAR" java-jars/OOXML-Compat-Normalize-java-quarkus.jar
          cp java/README.md java-jars/JAVA-README.md
          cp quarkus/README.md java-jars/QUARKUS-README.md
          cp quarkus/jpackage/LOGS.txt java-jars/LOGS.txt
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md java-jars/
          sha256sum java-jars/*.jar > java-jars/SHA256SUMS-java.txt

      - name: Upload Java JARs
        uses: actions/upload-artifact@v4
        with:
          name: OOXML-Compat-Normalize-java-jars
          path: java-jars/
          if-no-files-found: error

  java_portable:
    name: Build Java portable ${{ matrix.rid }}
    needs: [release_config, java]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: OOXML-Compat-Normalize-java-portable-win-x64
          - os: ubuntu-22.04
            rid: linux-x64
            artifact: OOXML-Compat-Normalize-java-portable-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download built Java JARs
        uses: actions/download-artifact@v4
        with:
          name: OOXML-Compat-Normalize-java-jars
          path: java-jars

      - name: Ensure WiX Toolset is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            choco install wixtoolset --yes --no-progress
            $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
            $wixPattern = Join-Path $programFilesX86 'WiX Toolset v3.*\bin'
            $wixBin = Get-ChildItem -Path $wixPattern -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wixBin) { throw 'WiX Toolset installation directory was not found' }
            $wixBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Windows Java portable and Quarkus EXE installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./quarkus/jpackage/package-windows.ps1 `
            -QuarkusJar java-jars/OOXML-Compat-Normalize-java-quarkus.jar `
            -CoreJar java-jars/OOXML-Compat-Normalize-java-core.jar `
            -Destination quarkus/target/jpackage `
            -AppVersion 0.4.0

      - name: Smoke-test Windows packaged Quarkus EXE, home page and portable log
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appDir = Resolve-Path 'quarkus/target/jpackage/OOXML-Compat-Normalize-Quarkus'
          $app = Join-Path $appDir 'OOXML-Compat-Normalize-Quarkus.exe'
          $log = Join-Path $appDir 'logs/ooxml-compat-normalize-quarkus.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $env:QUARKUS_HTTP_PORT = '18081'
          $process = Start-Process -FilePath $app -WorkingDirectory $appDir -PassThru
          try {
            $started = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:18081/api/info' -TimeoutSec 2
                if ($response.name -eq 'ooxml-compat-normalize-quarkus') {
                  $started = $true
                  break
                }
              } catch {
              }
              if ($process.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $started) {
              if (Test-Path $log) { Get-Content $log }
              throw 'Packaged Quarkus EXE did not become ready'
            }
            $homePage = Invoke-WebRequest -Uri 'http://127.0.0.1:18081/' -TimeoutSec 5
            if ($homePage.StatusCode -ne 200 -or $homePage.Content -notmatch 'Normalizza e scarica') {
              throw 'Packaged Quarkus home page is not available'
            }
            for ($i = 0; $i -lt 20 -and -not (Test-Path $log); $i++) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path $log)) { throw "Portable diagnostic log was not created beside the EXE: $log" }
            $text = Get-Content $log -Raw
            if ($text -notmatch 'OOXML Compat Normalize Quarkus local service started') {
              throw 'Diagnostic log startup marker is missing'
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Prepare Windows Java artifact payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path java-portable-release -Force | Out-Null
          Copy-Item quarkus/target/jpackage/OOXML-Compat-Normalize-java-portable-win-x64.zip java-portable-release/
          Copy-Item quarkus/target/jpackage/OOXML-Compat-Normalize-java-quarkus-installer-win-x64.exe java-portable-release/

      - name: Build Linux bundled Java runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf java-portable
          mkdir -p java-portable/logs
          jlink \
            --add-modules ALL-MODULE-PATH \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --output java-portable/runtime
          cp java-jars/OOXML-Compat-Normalize-java-core.jar java-portable/
          cp java-jars/OOXML-Compat-Normalize-java-quarkus.jar java-portable/
          cp java-jars/JAVA-README.md java-jars/QUARKUS-README.md java-jars/LOGS.txt java-portable/
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md java-portable/
          cat > java-portable/ooxml-normalize <<'EOF'
          #!/usr/bin/env sh
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$DIR/runtime/bin/java" -jar "$DIR/OOXML-Compat-Normalize-java-core.jar" "$@"
          EOF
          cat > java-portable/ooxml-quarkus <<'EOF'
          #!/usr/bin/env sh
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          mkdir -p "$DIR/logs"
          export OOXML_LOG_FILE="$DIR/logs/ooxml-compat-normalize-quarkus.log"
          exec "$DIR/runtime/bin/java" -jar "$DIR/OOXML-Compat-Normalize-java-quarkus.jar" "$@"
          EOF
          chmod +x java-portable/ooxml-normalize java-portable/ooxml-quarkus

      - name: Smoke-test Linux Java portable core, home page and portable log
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          java-portable/ooxml-normalize --help
          LOG_FILE="$PWD/java-portable/logs/ooxml-compat-normalize-quarkus.log"
          rm -f "$LOG_FILE"
          QUARKUS_HTTP_PORT=18082 java-portable/ooxml-quarkus >"$RUNNER_TEMP/ooxml-quarkus-portable-console.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          started=false
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18082/api/info >/dev/null; then started=true; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$started" != true ]]; then
            cat "$RUNNER_TEMP/ooxml-quarkus-portable-console.log"
            [[ -f "$LOG_FILE" ]] && cat "$LOG_FILE"
            exit 1
          fi
          curl -fsS http://127.0.0.1:18082/ | grep -q 'Normalizza e scarica'
          test -s "$LOG_FILE"
          grep -q 'OOXML Compat Normalize Quarkus local service started' "$LOG_FILE"
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload Windows Java portable and installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: java-portable-release/
          if-no-files-found: error

      - name: Upload Linux Java portable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: java-portable/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: needs.release_config.outputs.publish == 'true'
    needs: [release_config, build_python, java, java_portable]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for dir in OOXML-Compat-Normalize-*; do
            [ -d "$dir" ] || continue
            case "$dir" in
              OOXML-Compat-Normalize-java-jars)
                cp "$dir/OOXML-Compat-Normalize-java-core.jar" ./OOXML-Compat-Normalize-java-core.jar
                cp "$dir/OOXML-Compat-Normalize-java-quarkus.jar" ./OOXML-Compat-Normalize-java-quarkus.jar
                ;;
              OOXML-Compat-Normalize-java-portable-win-x64)
                cp "$dir/OOXML-Compat-Normalize-java-portable-win-x64.zip" ./
                cp "$dir/OOXML-Compat-Normalize-java-quarkus-installer-win-x64.exe" ./
                ;;
              OOXML-Compat-Normalize-java-portable-linux-x64)
                chmod +x "$dir/ooxml-normalize" "$dir/ooxml-quarkus" || true
                (cd "$dir" && tar -czf "../OOXML-Compat-Normalize-java-portable-linux-x64.tar.gz" .)
                ;;
              OOXML-Compat-Normalize-python-portable-win-x64)
                (cd "$dir" && zip -9 -r "../OOXML-Compat-Normalize-python-portable-win-x64.zip" .)
                ;;
              OOXML-Compat-Normalize-python-portable-linux-x64)
                chmod +x "$dir/OOXML-Compat-Normalize" || true
                (cd "$dir" && tar -czf "../OOXML-Compat-Normalize-python-portable-linux-x64.tar.gz" .)
                ;;
            esac
          done
          sha256sum *.zip *.tar.gz *.jar *.exe > SHA256SUMS.txt

      - name: Create GitHub Release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_config.outputs.tag }}
          PRERELEASE: ${{ needs.release_config.outputs.prerelease }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$PRERELEASE" == "true" ]]; then
            EXTRA+=(--prerelease)
          fi
          gh release create "$TAG" \
            release/*.zip \
            release/*.tar.gz \
            release/*.jar \
            release/*.exe \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${EXTRA[@]}"
