name: Portable builds and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. v0.4.0. Leave empty for build-only.'
        required: false
        type: string
      prerelease:
        description: 'Publish as GitHub pre-release'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'java/**'
      - 'quarkus/**'
      - 'portable/**'
      - 'dotnet/**'
      - 'pyproject.toml'
      - '.github/workflows/portable-release.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release_config:
    name: Resolve release configuration
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.config.outputs.tag }}
      prerelease: ${{ steps.config.outputs.prerelease }}
      publish: ${{ steps.config.outputs.publish }}

    steps:
      - id: config
        name: Resolve tag and release mode
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG=""
          PRERELEASE="false"
          PUBLISH="false"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PUBLISH="true"
            [[ "$TAG" == *-* ]] && PRERELEASE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${MANUAL_TAG:-}" ]]; then
            TAG="$MANUAL_TAG"
            PRERELEASE="${MANUAL_PRERELEASE:-false}"
            PUBLISH="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    name: Build desktop ${{ matrix.rid }}
    needs: release_config
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: OOXML-Compat-Normalize-win-x64
            validator: dotnet/OpenXmlSdkValidator/bin/Release/net8.0/win-x64/publish/OpenXmlSdkValidator.exe
          - os: ubuntu-22.04
            rid: linux-x64
            artifact: OOXML-Compat-Normalize-linux-x64
            validator: dotnet/OpenXmlSdkValidator/bin/Release/net8.0/linux-x64/publish/OpenXmlSdkValidator
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Linux GUI prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tk-dev tcl-dev

      - name: Run Python tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Verify Tkinter
        shell: bash
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Publish self-contained Open XML SDK validator
        shell: bash
        run: >-
          dotnet publish dotnet/OpenXmlSdkValidator/OpenXmlSdkValidator.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Install PyInstaller
        shell: bash
        run: python -m pip install --upgrade pip "pyinstaller>=6.10"

      - name: Build one-file GUI executable
        shell: bash
        env:
          OPENXML_VALIDATOR_BIN: ${{ matrix.validator }}
        run: pyinstaller --clean --noconfirm portable/OOXMLCompatNormalize.spec

      - name: Smoke-test executable presence
        shell: bash
        run: |
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -type f -name 'OOXML-Compat-Normalize*' -print -quit)"

      - name: Prepare portable payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          cp dist/OOXML-Compat-Normalize* payload/
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md payload/
          python - <<'PY'
          from pathlib import Path
          import hashlib
          base = Path('payload')
          lines = []
          for p in sorted(base.glob('OOXML-Compat-Normalize*')):
              if p.is_file():
                  lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (base / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: payload/
          if-no-files-found: error

  java:
    name: Build Java core and Quarkus JARs
    needs: release_config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            quarkus/pom.xml

      - name: Build, test and install Java core
        shell: bash
        run: mvn -B -ntp -f java/pom.xml clean install

      - name: Smoke-test standalone core JAR
        shell: bash
        run: |
          set -euo pipefail
          CORE_JAR="$(find java/target -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          test -n "$CORE_JAR"
          java -jar "$CORE_JAR" --help

      - name: Build and test Quarkus local service
        shell: bash
        run: mvn -B -ntp -f quarkus/pom.xml clean verify package

      - name: Smoke-test Quarkus uber-JAR
        shell: bash
        run: |
          set -euo pipefail
          QUARKUS_JAR="$(find quarkus/target -maxdepth 1 -type f -name '*-runner.jar' -print -quit)"
          test -n "$QUARKUS_JAR"
          java -jar "$QUARKUS_JAR" >/tmp/ooxml-quarkus.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/info >/tmp/ooxml-info.json; then
              cat /tmp/ooxml-info.json
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ooxml-quarkus.log
          exit 1

      - name: Prepare Java JAR payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p java-jars
          CORE_JAR="$(find java/target -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          QUARKUS_JAR="$(find quarkus/target -maxdepth 1 -type f -name '*-runner.jar' -print -quit)"
          cp "$CORE_JAR" java-jars/ooxml-compat-normalize-java.jar
          cp "$QUARKUS_JAR" java-jars/ooxml-compat-normalize-quarkus.jar
          cp java/README.md java-jars/JAVA-README.md
          cp quarkus/README.md java-jars/QUARKUS-README.md
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md java-jars/
          sha256sum java-jars/*.jar > java-jars/SHA256SUMS-java.txt

      - name: Upload Java JARs
        uses: actions/upload-artifact@v4
        with:
          name: OOXML-Compat-Normalize-java-jars
          path: java-jars/
          if-no-files-found: error

  java_portable:
    name: Build Java portable ${{ matrix.rid }}
    needs: [release_config, java]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: OOXML-Compat-Normalize-java-portable-win-x64
          - os: ubuntu-22.04
            rid: linux-x64
            artifact: OOXML-Compat-Normalize-java-portable-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download built Java JARs
        uses: actions/download-artifact@v4
        with:
          name: OOXML-Compat-Normalize-java-jars
          path: java-jars

      - name: Build bundled Java runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf java-portable
          mkdir -p java-portable
          jlink \
            --add-modules ALL-MODULE-PATH \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --output java-portable/runtime
          cp java-jars/ooxml-compat-normalize-java.jar java-portable/
          cp java-jars/ooxml-compat-normalize-quarkus.jar java-portable/
          cp java-jars/JAVA-README.md java-jars/QUARKUS-README.md java-portable/
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md java-portable/

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cat > java-portable/ooxml-normalize.cmd <<'EOF'
          @echo off
          "%~dp0runtime\bin\java.exe" -jar "%~dp0ooxml-compat-normalize-java.jar" %*
          EOF
            cat > java-portable/ooxml-quarkus.cmd <<'EOF'
          @echo off
          "%~dp0runtime\bin\java.exe" -jar "%~dp0ooxml-compat-normalize-quarkus.jar" %*
          EOF
          else
            cat > java-portable/ooxml-normalize <<'EOF'
          #!/usr/bin/env sh
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$DIR/runtime/bin/java" -jar "$DIR/ooxml-compat-normalize-java.jar" "$@"
          EOF
            cat > java-portable/ooxml-quarkus <<'EOF'
          #!/usr/bin/env sh
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$DIR/runtime/bin/java" -jar "$DIR/ooxml-compat-normalize-quarkus.jar" "$@"
          EOF
            chmod +x java-portable/ooxml-normalize java-portable/ooxml-quarkus
          fi

      - name: Smoke-test Java portable core
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            java-portable/runtime/bin/java.exe -jar java-portable/ooxml-compat-normalize-java.jar --help
          else
            java-portable/runtime/bin/java -jar java-portable/ooxml-compat-normalize-java.jar --help
          fi

      - name: Upload Java portable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: java-portable/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: needs.release_config.outputs.publish == 'true'
    needs: [release_config, build, java, java_portable]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for dir in OOXML-Compat-Normalize-*; do
            [ -d "$dir" ] || continue
            case "$dir" in
              OOXML-Compat-Normalize-java-jars)
                cp "$dir/ooxml-compat-normalize-java.jar" ./ooxml-compat-normalize-java.jar
                cp "$dir/ooxml-compat-normalize-quarkus.jar" ./ooxml-compat-normalize-quarkus.jar
                ;;
              OOXML-Compat-Normalize-java-portable-win-x64)
                (cd "$dir" && zip -9 -r "../${dir}.zip" .)
                ;;
              OOXML-Compat-Normalize-java-portable-linux-x64)
                chmod +x "$dir/ooxml-normalize" "$dir/ooxml-quarkus" || true
                (cd "$dir" && tar -czf "../${dir}.tar.gz" .)
                ;;
              *win-x64)
                (cd "$dir" && zip -9 -r "../${dir}.zip" .)
                ;;
              *linux-x64)
                chmod +x "$dir/OOXML-Compat-Normalize" || true
                (cd "$dir" && tar -czf "../${dir}.tar.gz" .)
                ;;
            esac
          done
          sha256sum *.zip *.tar.gz *.jar > SHA256SUMS.txt

      - name: Create GitHub Release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_config.outputs.tag }}
          PRERELEASE: ${{ needs.release_config.outputs.prerelease }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$PRERELEASE" == "true" ]]; then
            EXTRA+=(--prerelease)
          fi
          gh release create "$TAG" \
            release/*.zip \
            release/*.tar.gz \
            release/*.jar \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${EXTRA[@]}"
