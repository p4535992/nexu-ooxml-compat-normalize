name: Prepare verified v0.4.0-rc.11 sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-rc11.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-v0.4.0-rc.11
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Preserve HTTP assertions in the distributable JAR integration suite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          testdir = Path('quarkus/src/test/java/io/github/p4535992/ooxmlcompatnormalize/quarkus')
          old = testdir / 'NormalizeResourceTest.java'
          new = testdir / 'NormalizeResourceIT.java'
          if old.exists():
              text = old.read_text().replace('QuarkusTest', 'QuarkusIntegrationTest').replace('class NormalizeResourceTest', 'class NormalizeResourceIT')
              text = text.replace('// QuarkusIntegrationTest configures RestAssured with quarkus.http.root-path.', '// Integration tests start the packaged JAR and configure the HTTP root path.')
              new.write_text(text)
              old.unlink()
          assert new.exists()
          pom = Path('quarkus/pom.xml')
          text = pom.read_text()
          if '<artifactId>maven-failsafe-plugin</artifactId>' not in text:
              plugin = '''      <!-- HTTP contract tests run against the actual distributable JAR. -->
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-failsafe-plugin</artifactId>
                  <version>${surefire-plugin.version}</version>
                  <executions><execution><goals><goal>integration-test</goal><goal>verify</goal></goals></execution></executions>
                  <configuration>
                    <systemPropertyVariables>
                      <java.util.logging.manager>org.jboss.logmanager.LogManager</java.util.logging.manager>
                      <maven.home>${maven.home}</maven.home>
                    </systemPropertyVariables>
                  </configuration>
                </plugin>
          '''
              text = text.replace('    </plugins>', plugin + '    </plugins>')
              pom.write_text(text)
          for p in [Path('pyproject.toml'), Path('src/ooxml_compat_normalize/__init__.py'), Path('java/pom.xml'), pom, Path('quarkus/src/main/java/io/github/p4535992/ooxmlcompatnormalize/quarkus/NormalizeResource.java')]:
              text = p.read_text().replace('0.4.0-rc.9', '0.4.0-rc.11').replace('0.4.0rc9', '0.4.0rc11')
              p.write_text(text)
          Path('docs/release-testing.md').write_text('''# Release validation

          Run `mvn -f java/pom.xml clean install` followed by `mvn -f quarkus/pom.xml clean verify`.

          The Java core unit tests and Python unit tests remain separate from HTTP integration tests. `NormalizeResourceIT` uses `@QuarkusIntegrationTest` and Maven Failsafe to execute the original API and HTML assertions against the packaged Quarkus JAR. `mvn test` alone does not run packaged integration tests; use `verify`.

          This choice tests the same executable application shipped to users. The previous in-process `@QuarkusTest` bootstrap returned 404 for the REST resource despite the packaged JAR and container passing the real HTTP checks. No HTTP assertion was disabled or weakened: endpoint, engine, formats, context path and HTML checks are retained in the packaged integration phase.

          Combined Windows/Linux workflows additionally start the actual frozen executable and verify both engines, mode switching, HTML selectors, logs and archive roots. Container workflows perform audit and normalization requests and verify context paths, non-root execution and real backend process shutdown.

          Passing these checks does not guarantee pixel-identical document rendering across office suites. Test representative documents on copies before using a pre-release in production.
          ''')
          PY
      - name: Commit only application source, test setup and version metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quarkus/src/test/java/io/github/p4535992/ooxmlcompatnormalize/quarkus/ quarkus/pom.xml java/pom.xml pyproject.toml src/ooxml_compat_normalize/__init__.py quarkus/src/main/java/io/github/p4535992/ooxmlcompatnormalize/quarkus/NormalizeResource.java docs/release-testing.md
          if ! git diff --cached --quiet; then
            git commit -m 'release: align rc11 versions and verify HTTP contract against packaged Quarkus JAR'
            git push origin HEAD:main
          fi
          echo "Prepared source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
