name: Public readiness maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-readiness-maintenance.yml'

permissions:
  contents: write
  actions: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update historical release links after repository rename
        shell: bash
        run: |
          set -euo pipefail
          old='https://github.com/p4535992/ooxml-compat-normalize'
          new='https://github.com/p4535992/nexu-ooxml-compat-normalize'
          changed=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
            if grep -Fq "$old" <<<"$body"; then
              updated="${body//$old/$new}"
              notes="$(mktemp)"
              printf '%s\n' "$updated" > "$notes"
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
              rm -f "$notes"
              echo "Updated release notes: $tag"
              changed=$((changed + 1))
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          echo "Historical release notes updated: $changed" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old GitHub Actions artifacts
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' +%s)"
          deleted=0
          kept=0
          while IFS=$'\t' read -r id created name; do
            [ -n "$id" ] || continue
            created_epoch="$(date -u -d "$created" +%s)"
            if [ "$created_epoch" -lt "$cutoff" ]; then
              echo "Deleting old Actions artifact: $id $created $name"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              deleted=$((deleted + 1))
            else
              kept=$((kept + 1))
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .created_at, .name] | @tsv')
          {
            echo "Old Actions artifacts deleted: $deleted"
            echo "Recent Actions artifacts kept: $kept"
            echo "GitHub Release assets were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
