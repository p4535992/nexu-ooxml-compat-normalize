name: Verified stable release - all distributions
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable release tag, for example v0.4.0'
        required: true
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/release-stable.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: verified-stable-release
  cancel-in-progress: false
env:
  TAG: ${{ inputs.release_tag || 'v0.4.0' }}
  GH_TOKEN: ${{ github.token }}
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'release: publish v0.4.0 stable'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Align version metadata and create draft stable release
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'An explicit stable release tag is required'; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release or draft'; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'Refusing to move an existing tag'; exit 1
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tag = os.environ['TAG']
          match = re.fullmatch(r'v(\d+\.\d+\.\d+)', tag)
          assert match
          java_version = match[1]
          python_version = match[1]
          pom = Path('java/pom.xml')
          old_java = ET.fromstring(pom.read_text()).find('{http://maven.apache.org/POM/4.0.0}version').text
          pyproject = Path('pyproject.toml')
          old_python = re.search(r'^version\s*=\s*"([^"]+)"', pyproject.read_text(), re.M)[1]
          replacements = [
              (pyproject, old_python, python_version),
              (Path('src/ooxml_compat_normalize/__init__.py'), old_python, python_version),
              (pom, old_java, java_version),
              (Path('quarkus/pom.xml'), old_java, java_version),
              (Path('quarkus/src/main/java/io/github/p4535992/ooxmlcompatnormalize/quarkus/NormalizeResource.java'), old_java, java_version),
          ]
          for path, old, new in replacements:
              text = path.read_text(encoding='utf-8')
              assert old in text, f'Expected version not found in {path}'
              path.write_text(text.replace(old, new), encoding='utf-8')
          assert Path('quarkus/src/test/java/io/github/p4535992/ooxmlcompatnormalize/quarkus/NormalizeResourceIT.java').exists()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml src/ooxml_compat_normalize/__init__.py java/pom.xml quarkus/pom.xml quarkus/src/main/java/io/github/p4535992/ooxmlcompatnormalize/quarkus/NormalizeResource.java
          if ! git diff --cached --quiet; then
            git commit -m "release: align version metadata for $TAG"
            git push origin HEAD:main
          fi
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$source_sha" >/dev/null
          cat > notes.md <<EOF
          ## Stable release

          Source: \`$source_sha\`.
          This is the stable v0.4.0 release, rebuilt from the validated RC12 source line with stable version metadata.
          This iteration refreshes the version metadata and distribution builds; it does not introduce new normalization rules.

          ### Combined desktop (no Docker required)
          - Windows x64: \`OOXML-Compat-Normalize-combined-portable-win-x64.zip\`
          - Linux x64: \`OOXML-Compat-Normalize-combined-portable-linux-x64.tar.gz\`

          Extract the entire archive, then run \`OOXML-Compat-Normalize-Combined.exe\` or \`./OOXML-Compat-Normalize-Combined\`. Runtimes are bundled; keep the accompanying directories beside the executable.

          UI: \`http://127.0.0.1:8080/ooxml-compat-normalize/\`.
          Default: **Python + Java** active. HTML and REST also offer **only Python** and **only Java**. Selecting both makes both engines available, not a sequential double conversion.
          Logs remain in the portable folder's \`logs/\` directory.

          ### Other distributions retained
          Dedicated Python/Java Windows and Linux portables, Java core and Quarkus JARs, Java Windows installer, and Java/Python/combined Docker Compose bundles in both ZIP and TAR.GZ.
          Each archive has one root directory matching its name. Docker bundles include \`start_all.sh\` and \`down_all.sh\`.

          All 15 primary assets are checked before publication and listed in \`SHA256SUMS.txt\`. Unit tests, packaged Quarkus HTTP tests, combined launcher checks and container regression checks are required.
          Original font families remain preserved by default. Test copies of representative documents; these checks do not guarantee pixel-identical rendering across office suites.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false --title "$TAG - Stable release" --notes-file notes.md
      - name: Start combined builds and Docker verification at the release tag
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run combined-portable.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f release_tag="$TAG"
          gh workflow run docker-bundles.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f release_tag="$TAG"
          gh workflow run docker-smoke.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          gh workflow run docker-combined-mode-smoke.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  native:
    name: Dedicated portables ${{ matrix.rid }}
    needs: prepare
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            quarkus/pom.xml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Linux GUI prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk-dev tcl-dev
      - name: Tests and native builds
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          mvn -B -ntp -f java/pom.xml clean install
          mvn -B -ntp -f quarkus/pom.xml clean verify
          mkdir -p java-jars native-release
          core="$(find java/target -maxdepth 1 -name '*-all.jar' -print -quit)"
          quarkus="$(find quarkus/target -maxdepth 1 -name '*-runner.jar' -print -quit)"
          test -n "$core" && test -n "$quarkus"
          java -jar "$core" --help
          cp "$core" java-jars/OOXML-Compat-Normalize-java-core.jar
          cp "$quarkus" java-jars/OOXML-Compat-Normalize-java-quarkus.jar
          dotnet publish dotnet/OpenXmlSdkValidator/OpenXmlSdkValidator.csproj -c Release -r "$RID" --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
          python -m pip install --upgrade 'pyinstaller>=6.10'
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          export OPENXML_VALIDATOR_BIN="dotnet/OpenXmlSdkValidator/bin/Release/net8.0/$RID/publish/OpenXmlSdkValidator$suffix"
          pyinstaller --clean --noconfirm portable/OOXMLCompatNormalize.spec
      - name: Package Python portable and notices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, shutil, tarfile, zipfile
          name = 'OOXML-Compat-Normalize-python-portable-' + os.environ['RID']
          root = Path('native-work') / name
          root.mkdir(parents=True, exist_ok=True)
          executable = 'OOXML-Compat-Normalize' + ('.exe' if os.name == 'nt' else '')
          shutil.copy2(Path('dist') / executable, root / executable)
          for file in ('LICENSE', 'THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_LICENSES.md'):
              shutil.copy2(file, root / file)
          shutil.copy2('portable/README.md', root / 'README.md')
          notices = root / 'licenses' / 'dotnet'
          notices.mkdir(parents=True)
          for file in ('LICENSE.txt', 'ThirdPartyNotices.txt'):
              shutil.copy2(Path(os.environ['DOTNET_ROOT']) / file, notices / file)
          if os.name == 'nt':
              with zipfile.ZipFile(Path('native-release') / (name + '.zip'), 'w', zipfile.ZIP_DEFLATED) as z:
                  for p in root.rglob('*'):
                      z.write(p, p.relative_to(root.parent))
          else:
              (root / executable).chmod(0o755)
              with tarfile.open(Path('native-release') / (name + '.tar.gz'), 'w:gz') as t:
                  t.add(root, arcname=name)
          PY
      - name: Ensure WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            $base = [Environment]::GetFolderPath('ProgramFilesX86')
            $bin = Get-ChildItem (Join-Path $base 'WiX Toolset v3.*\bin') -Directory | Select-Object -First 1
            if (-not $bin) { throw 'WiX bin directory missing' }
            $bin.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Windows Java portable and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appVersion = ($env:TAG -replace '^v','') -replace '-rc\..*$',''
          ./quarkus/jpackage/package-windows.ps1 -QuarkusJar java-jars/OOXML-Compat-Normalize-java-quarkus.jar -CoreJar java-jars/OOXML-Compat-Normalize-java-core.jar -Destination quarkus/target/jpackage -AppVersion $appVersion
          Copy-Item quarkus/target/jpackage/OOXML-Compat-Normalize-java-portable-win-x64.zip native-release/
          Copy-Item quarkus/target/jpackage/OOXML-Compat-Normalize-java-quarkus-installer-win-x64.exe native-release/
      - name: Linux Java portable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root='native-work/OOXML-Compat-Normalize-java-portable-linux-x64'
          mkdir -p "$root/logs"
          jlink --add-modules ALL-MODULE-PATH --strip-debug --no-header-files --no-man-pages --compress=2 --output "$root/runtime"
          cp java-jars/*.jar "$root/"
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md "$root/"
          cp java/README.md "$root/JAVA-README.md"
          cp quarkus/README.md "$root/QUARKUS-README.md"
          cp quarkus/jpackage/LOGS.txt "$root/"
          cat > "$root/ooxml-normalize" <<'EOF'
          #!/usr/bin/env sh
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$DIR/runtime/bin/java" -jar "$DIR/OOXML-Compat-Normalize-java-core.jar" "$@"
          EOF
          cat > "$root/ooxml-quarkus" <<'EOF'
          #!/usr/bin/env sh
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          mkdir -p "$DIR/logs"
          export OOXML_LOG_FILE="$DIR/logs/ooxml-compat-normalize-quarkus.log"
          : "${OOXML_CONTEXT_PATH:=/ooxml-compat-normalize}"
          export OOXML_CONTEXT_PATH
          exec "$DIR/runtime/bin/java" -jar "$DIR/OOXML-Compat-Normalize-java-quarkus.jar" "$@"
          EOF
          chmod +x "$root/ooxml-normalize" "$root/ooxml-quarkus"
          test -d "$root/runtime/legal"
          "$root/ooxml-normalize" --help
          tar -C native-work -czf native-release/OOXML-Compat-Normalize-java-portable-linux-x64.tar.gz OOXML-Compat-Normalize-java-portable-linux-x64
          cp java-jars/*.jar native-release/
      - name: Test actual Java launcher and context-path UI
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          from urllib.request import urlopen
          if os.name == 'nt':
              root = Path('quarkus/target/jpackage/OOXML-Compat-Normalize-java-portable-win-x64').resolve()
              cmd = [str(root / 'OOXML-Compat-Normalize-Quarkus.exe')]
          else:
              root = Path('native-work/OOXML-Compat-Normalize-java-portable-linux-x64').resolve()
              cmd = [str(root / 'ooxml-quarkus')]
          env = dict(os.environ, QUARKUS_HTTP_PORT='18087', OOXML_OPEN_BROWSER='false', OOXML_CONTEXT_PATH='/ooxml-compat-normalize')
          with open('java-launcher-smoke.log', 'wb') as log:
              p = subprocess.Popen(cmd, cwd=root, env=env, stdout=log, stderr=subprocess.STDOUT)
              try:
                  base = 'http://127.0.0.1:18087/ooxml-compat-normalize'
                  for attempt in range(120):
                      try:
                          with urlopen(base + '/api/info', timeout=2) as response:
                              info = json.load(response)
                          assert info['engine'] == 'java'
                          assert info['version'] == os.environ['TAG'][1:]
                          break
                      except (OSError, ValueError):
                          if p.poll() is not None:
                              raise RuntimeError('Java launcher exited')
                          time.sleep(1)
                  else:
                      raise RuntimeError('Java launcher readiness timeout')
                  with urlopen(base + '/', timeout=5) as response:
                      assert 'Normalizza e scarica' in response.read().decode()
                  assert (root / 'logs/ooxml-compat-normalize-quarkus.log').is_file()
                  try:
                      urlopen('http://127.0.0.1:18087/api/info', timeout=3)
                  except OSError:
                      pass
                  else:
                      raise AssertionError('Unexpected root-level API')
                  print('Actual Java launcher: version, UI, API, context path and logs OK')
              finally:
                  if p.poll() is None:
                      if os.name == 'nt':
                          subprocess.run(['taskkill.exe', '/PID', str(p.pid), '/T', '/F'], check=False)
                      else:
                          p.terminate()
                      p.wait(timeout=20)
          PY
      - name: Verify archives and upload directly to draft
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile, zipfile
          for archive in Path('native-release').iterdir():
              if archive.name.endswith('.zip'):
                  expected = archive.stem
                  with zipfile.ZipFile(archive) as z:
                      assert z.testzip() is None
                      names = z.namelist()
              elif archive.name.endswith('.tar.gz'):
                  expected = archive.name[:-7]
                  with tarfile.open(archive) as t:
                      names = t.getnames()
              else:
                  continue
              assert all('..' not in PurePosixPath(n).parts and not n.startswith('/') for n in names)
              assert {n.replace('\\', '/').split('/')[0] for n in names} == {expected}
              print(archive.name + ': archive root OK')
          PY
          gh release upload "$TAG" native-release/* --repo "$GITHUB_REPOSITORY" --clobber

  dependent_builds:
    name: Require combined and Docker verification
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Require successful workflows for the exact release source
        shell: bash
        run: |
          set -euo pipefail
          for workflow in combined-portable.yml docker-bundles.yml docker-smoke.yml docker-combined-mode-smoke.yml; do
            passed=false
            for i in $(seq 1 240); do
              run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&head_sha=$SOURCE_SHA&per_page=10" --jq '.workflow_runs | sort_by(.created_at) | last | {id,status,conclusion}')"
              echo "$workflow: $run"
              status="$(jq -r .status <<< "$run")"
              conclusion="$(jq -r .conclusion <<< "$run")"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] || { echo "$workflow failed"; exit 1; }
                passed=true
                break
              fi
              sleep 10
            done
            [ "$passed" = true ] || { echo "$workflow timed out"; exit 1; }
          done

  publish:
    name: Verify assets and publish stable release
    needs: [prepare, native, dependent_builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Download and verify complete payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir verified
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verified
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, tarfile, zipfile
          root = Path('verified')
          prefix = 'OOXML-Compat-Normalize-'
          expected = set()
          for engine in ('python', 'java', 'combined'):
              expected.add(prefix + engine + '-portable-win-x64.zip')
              expected.add(prefix + engine + '-portable-linux-x64.tar.gz')
              for ext in ('.zip', '.tar.gz'):
                  expected.add(prefix + engine + '-docker-compose' + ext)
          expected.update({prefix + 'java-core.jar', prefix + 'java-quarkus.jar', prefix + 'java-quarkus-installer-win-x64.exe'})
          assert len(expected) == 15
          missing = expected - {p.name for p in root.iterdir()}
          assert not missing, sorted(missing)
          lines, docker_lines = [], []
          for name in sorted(expected):
              path = root / name
              assert path.stat().st_size > 0
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              line = digest + '  ' + name
              lines.append(line)
              if '-docker-compose.' in name:
                  docker_lines.append(line)
              if name.endswith('.zip'):
                  archive_root = name[:-4]
                  with zipfile.ZipFile(path) as z:
                      assert z.testzip() is None
                      names = z.namelist()
              elif name.endswith('.tar.gz'):
                  archive_root = name[:-7]
                  with tarfile.open(path) as t:
                      names = t.getnames()
              else:
                  continue
              assert all('..' not in PurePosixPath(n).parts and not n.startswith('/') for n in names)
              assert {n.replace('\\', '/').lstrip('./').split('/')[0] for n in names if n} == {archive_root}
              if '-docker-compose.' in name:
                  for file in ('docker-compose.yml', 'start_all.sh', 'down_all.sh'):
                      assert archive_root + '/' + file in names
              print(name + ': complete and checked')
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (root / 'SHA256SUMS-docker.txt').write_text('\n'.join(docker_lines) + '\n', encoding='utf-8')
          (root / 'BUILD-INFO.txt').write_text('Release: ' + os.environ['TAG'] + '\nSource: ' + os.environ['SOURCE_SHA'] + '\nPrimary assets checked: 15\nPython and Java core tests: passed\nPackaged Quarkus HTTP integration tests: passed\nCombined Windows/Linux launch and engine-mode checks: passed\nJava/Python/combined container regression workflows: passed\nNo cross-suite pixel-identical rendering guarantee.\n', encoding='utf-8')
          PY
          gh release upload "$TAG" verified/SHA256SUMS.txt verified/SHA256SUMS-docker.txt verified/BUILD-INFO.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish stable release and mark latest
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets > published.json
          jq -e '.isPrerelease == false and .isDraft == false' published.json
          jq '{url,isDraft,isPrerelease,assets:[.assets[].name]}' published.json
