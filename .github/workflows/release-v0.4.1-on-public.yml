name: Publish v0.4.1 when repository becomes public

on:
  public:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch verified stable v0.4.1 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.1 already exists; nothing to dispatch."
            exit 0
          fi
          gh workflow run release-stable.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag=v0.4.1
          echo "Dispatched release-stable.yml for v0.4.1."

      - name: Remove one-shot dispatcher
        if: success()
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Commit dispatcher cleanup
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-v0.4.1-on-public.yml
          git commit -m 'ci: remove v0.4.1 public-release dispatcher'
          git push origin HEAD:main
