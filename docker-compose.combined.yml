name: ooxml-compat-normalize-combined

services:
  normalizer-combined:
    build:
      context: .
      dockerfile: Dockerfile.combined
    image: ooxml-compat-normalize-combined:local
    ports:
      - "${OOXML_BIND_ADDRESS:-127.0.0.1}:${OOXML_PORT:-8080}:8080"
    environment:
      OOXML_HTTP_HOST: "0.0.0.0"
      OOXML_HTTP_PORT: "8080"
      OOXML_CONTEXT_PATH: "${OOXML_CONTEXT_PATH:-/ooxml-compat-normalize}"
      OOXML_ENGINE_MODE: "${OOXML_ENGINE_MODE:-both}"
      OOXML_DEFAULT_ENGINE: "${OOXML_DEFAULT_ENGINE:-python}"
      OOXML_JAVA_INTERNAL_PORT: "18081"
      OOXML_PYTHON_INTERNAL_PORT: "18082"
      OOXML_GATEWAY_LOG_FILE: "/data/logs/ooxml-compat-normalize-gateway.log"
      OOXML_OPENXML_VALIDATOR: "/app/validator/OpenXmlSdkValidator"
      OOXML_SDK_VALIDATION: "required"
    volumes:
      - ooxml-combined-logs:/data/logs
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  ooxml-combined-logs:
