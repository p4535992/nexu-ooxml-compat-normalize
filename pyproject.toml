[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ooxml-compat-normalize"
version = "0.4.0rc2"
description = "Loss-averse OOXML normalizer for DOCX/XLSX/PPTX cross-suite interoperability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ooxml-compat-normalize contributors" }
]
keywords = ["docx", "ooxml", "onlyoffice", "libreoffice", "xlsx", "pptx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = []

[project.optional-dependencies]
portable = ["pyinstaller>=6.10"]

[project.scripts]
ooxml-compat-normalize = "ooxml_compat_normalize.cli:main"
ooxml-compat-normalize-gui = "ooxml_compat_normalize.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
