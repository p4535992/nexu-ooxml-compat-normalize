[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-compat-normalizer"
version = "0.1.0"
description = "Conservative OOXML normalizer for LibreOffice / ONLYOFFICE / Word interoperability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "docx-compat-normalizer contributors" }
]
keywords = ["docx", "ooxml", "onlyoffice", "libreoffice", "xlsx", "pptx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = []

[project.scripts]
ooxml-compat-normalize = "docx_compat_normalizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
