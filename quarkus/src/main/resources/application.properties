quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.limits.max-body-size=256M
quarkus.package.jar.type=uber-jar
quarkus.banner.enabled=false
quarkus.http.cors.enabled=false

# Diagnostic logging. Relative paths are resolved from the launch directory.
# Windows jpackage portable launchers override this to $ROOTDIR/logs/... so
# logs stay beside the EXE/app image rather than under its app/ subdirectory.
quarkus.log.file.enabled=true
quarkus.log.file.path=${OOXML_LOG_FILE:logs/ooxml-compat-normalize-quarkus.log}
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.rotate-on-boot=true

# Raw JARs do not open a browser automatically. jpackage desktop launchers opt in.
ooxml.open-browser=${OOXML_OPEN_BROWSER:false}
